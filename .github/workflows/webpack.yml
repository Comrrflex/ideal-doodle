name: NodeJS Build

on:
  push:
    branches: [ "main" ]
    paths:
      - "marketing-saas-mvp/**"
      - ".github/workflows/webpack.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "marketing-saas-mvp/**"
      - ".github/workflows/webpack.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: "npm"
        cache-dependency-path: marketing-saas-mvp/package-lock.json

    - name: Build
      working-directory: marketing-saas-mvp
      run: |
        npm ci
        npm run build
