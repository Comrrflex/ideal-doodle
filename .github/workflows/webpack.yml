name: NodeJS Build

on:
  push:
    branches: [ "main" ]
    paths:
      - "tracelayer-app/**"
      - ".github/workflows/webpack.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "tracelayer-app/**"
      - ".github/workflows/webpack.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: "npm"
        cache-dependency-path: tracelayer-app/package-lock.json

    - name: Build
      working-directory: tracelayer-app
      run: |
        npm ci
        npm run build
