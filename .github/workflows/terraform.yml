name: Terraform

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Detect Terraform files
      id: terraform_files
      run: |
        directories_file="$RUNNER_TEMP/terraform-directories.txt"

        find . \
          -path '*/.terraform' -prune -o \
          -type f \( -name '*.tf' -o -name '*.tfvars' \) -print0 |
          while IFS= read -r -d '' file; do
            dirname "$file"
          done |
          sort -u > "$directories_file"

        if [ ! -s "$directories_file" ]; then
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "No Terraform files were found. Terraform commands were skipped." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        echo "found=true" >> "$GITHUB_OUTPUT"
        {
          echo "directories<<EOF"
          cat "$directories_file"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Terraform Format
      if: steps.terraform_files.outputs.found == 'true'
      run: terraform fmt -check -recursive

    - name: Terraform Init and Validate
      if: steps.terraform_files.outputs.found == 'true'
      run: |
        while IFS= read -r directory; do
          echo "::group::terraform init/validate ${directory}"
          terraform -chdir="$directory" init -input=false
          terraform -chdir="$directory" validate
          echo "::endgroup::"
        done < "$RUNNER_TEMP/terraform-directories.txt"

    - name: Terraform Plan
      if: steps.terraform_files.outputs.found == 'true'
      run: |
        while IFS= read -r directory; do
          echo "::group::terraform plan ${directory}"
          terraform -chdir="$directory" plan -input=false -out=tfplan
          echo "::endgroup::"
        done < "$RUNNER_TEMP/terraform-directories.txt"

    - name: Terraform Apply
      if: steps.terraform_files.outputs.found == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        while IFS= read -r directory; do
          echo "::group::terraform apply ${directory}"
          terraform -chdir="$directory" apply -auto-approve -input=false tfplan
          echo "::endgroup::"
        done < "$RUNNER_TEMP/terraform-directories.txt"
